version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/erp
      JWT_SECRET: supersecretjwtkeyforerpsystem2026
    ports:
      - '5000:5000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: always
    ports:
      - '5174:5174'
    depends_on:
      - backend

volumes:
  postgres_data:
